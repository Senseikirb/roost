name: Validate Roost

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-roost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the Pages site in an isolated browser
        shell: bash
        env:
          ROOST_APP_URL: http://127.0.0.1:8765/roost/index.html
          ROOST_FEED_APP_URL: http://roost.localhost:8765/roost/index.html
          ROOST_WORKFLOW_APP_URL: http://workflow.localhost:8765/roost/index.html
          ROOST_CDP_PORT: '9223'
        run: |
          set -euo pipefail
          site_root="$(mktemp -d)"
          profile="$(mktemp -d)"
          mkdir "$site_root/roost"
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.jpg' -o -name '*.webp' -o -name '*.svg' -o -name 'manifest.json' \) -exec cp {} "$site_root/roost/" \;
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site_root" >"$RUNNER_TEMP/roost-http.log" 2>&1 &
          server_pid=$!
          google-chrome --headless --disable-gpu --disable-background-networking --no-first-run \
            --user-data-dir="$profile" --remote-debugging-address=127.0.0.1 --remote-debugging-port="$ROOST_CDP_PORT" \
            about:blank >"$RUNNER_TEMP/roost-chrome.log" 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" "$server_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 15 --retry-all-errors --retry-delay 1 "$ROOST_APP_URL" -o /dev/null
          if ! curl --silent --show-error --fail --retry 30 --retry-all-errors --retry-delay 1 "http://127.0.0.1:$ROOST_CDP_PORT/json/version"; then
            cat "$RUNNER_TEMP/roost-chrome.log"
            exit 1
          fi
          export ROOST_SCREENSHOT_DIR="$RUNNER_TEMP/roost-desk-preview"
          node tests/run-roost-validation.mjs
      - name: Save synthetic desk previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roost-desk-preview
          path: ${{ runner.temp }}/roost-desk-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the public Pages release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Senseikirb/roost'
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          origin='https://senseikirb.github.io/roost'
          assets=(index.html roost-desk.css sw.js manifest.json roost-ridgeline.jpg iq-rfsoc-explorer.html roost-destination-finder.html favicon-32.png icon-180.png icon-192.png icon-512.png)
          scratch="$(mktemp -d)"
          sha256sum "${assets[@]}" > "$scratch/expected.sha256"
          deadline=$((SECONDS + 290))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            echo "Checking the public release (attempt $attempt)"
            downloaded=true
            for asset in "${assets[@]}"; do
              if (( SECONDS >= deadline )); then break 2; fi
              if ! curl --proto '=https' --fail --silent --show-error --compressed --connect-timeout 4 --max-time 7 \
                --header 'Cache-Control: no-cache' --output "$scratch/$asset" \
                "$origin/$asset?roost_release=$GITHUB_SHA&attempt=$attempt"; then
                downloaded=false
                break
              fi
            done
            if [[ "$downloaded" == true ]] &&
               curl --proto '=https' --fail --silent --show-error --compressed --connect-timeout 4 --max-time 7 \
                 --output "$scratch/homepage.html" "$origin/?roost_release=$GITHUB_SHA&attempt=$attempt" &&
               cmp --silent index.html "$scratch/homepage.html" &&
               (cd "$scratch" && sha256sum --check expected.sha256); then
              echo "Public Pages files match $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Public Pages did not serve all committed release bytes within five minutes." >&2
          exit 1
